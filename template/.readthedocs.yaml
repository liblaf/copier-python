version: 2

python:
  install:
    - method: uv
      command: sync

build:
  os: ubuntu-lts-latest
  tools:
    python: latest
  jobs:
    post_checkout:
      # ref: <https://docs.readthedocs.com/platform/stable/build-customization.html#unshallow-git-clone>
      - git fetch --unshallow || true

    pre_build:
      - sed --in-place "s|__SITE_URL__|$READTHEDOCS_CANONICAL_URL|g" 'zensical.toml'

    build:
      html:
        - zensical build

    post_build:
      - mkdir --parents --verbose "$READTHEDOCS_OUTPUT/html/"
      - cp --recursive site/* "$READTHEDOCS_OUTPUT/html/"
